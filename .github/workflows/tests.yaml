name: Unit Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Werror"

    - name: make
      run: cmake --build build

    - name: Card Unit Tests
      continue-on-error: true
      run: ctest --test-dir build -R tests_card --output-on-failure

    - name: Deck Unit Tests
      continue-on-error: true
      run: ctest --test-dir build -R tests_deck --output-on-failure

    - name: Card Manager Unit Tests
      continue-on-error: true
      run: ctest --test-dir build -R tests_card_manager --output-on-failure

    - name: List all tests
      run: ctest --test-dir build -N
